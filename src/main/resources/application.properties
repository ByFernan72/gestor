spring.application.name=${APP_NAME:gestor}
server.port=${SERVER_PORT:8080}

# Base de datos local H2 persistente en archivo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gestordb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Configuración JPA / Hibernate
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Consola web de H2 para inspeccionar tablas (http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_ALLOW_OTHERS:false}